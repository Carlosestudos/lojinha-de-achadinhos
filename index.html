<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lojinha de Achadinhos | As melhores ofertas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background-color: #000000;
    }

    .viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ajuste para Computador (Tela cheia sem distorção) */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    /* Camada dos botões para Computador */
    .buttons-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 500px;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 2;
    }

    .btn-click {
      flex: 1;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 30px;
      transition: all 0.2s ease-in-out;
      background: rgba(255, 255, 255, 0.01);
      border: 2px solid transparent;
    }

    .btn-click:hover, .btn-click:active {
      transform: scale(1.03);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    /* Regulação Retrato para Celular (Exibe todo o anúncio sem cortar textos) */
    @media (max-width: 768px) {
      .bg-video {
        width: 100%;
        height: auto;
        max-height: 100vh;
        object-fit: contain; /* Mostra 100% da arte na tela do telemóvel */
      }

      .buttons-layer {
        top: 50%;
        width: 82%;
        gap: 10px;
      }

      .btn-click {
        height: 42px;
      }
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <video autoplay loop muted playsinline class="bg-video">
      <source src="fundo-lojinha.mp4" type="video/mp4">
      Seu navegador não suporta vídeos em HTML5.
    </video>

    <div class="buttons-layer">
      <a href="https://collshp.com/chztrlojinha?view=storefront" target="_blank" rel="noopener noreferrer" class="btn-click" title="Ir para Shopee"></a>
      <a href="https://mercadolivre.com/sec/1nNnSoA" target="_blank" rel="noopener noreferrer" class="btn-click" title="Ir para Mercado Livre"></a>
    </div>
  </div>

</body>
</html>
