<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🛒 Lojinha de Achadinhos do Carlos</title>
  
  <link rel="manifest" href="https://carlosestudos.github.io/lojinha-de-achadinhos/manifest.json">

  <!-- Meta Tags para Redes Sociais e WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="🛒 Lojinha de Achadinhos do Carlos">
  <meta property="og:description" content="As melhores ofertas com ótimo custo-benefício!">
  <meta property="og:image" content="https://carlosestudos.github.io/lojinha-de-achadinhos/1000278928.jpg">
  <meta property="og:url" content="https://carlosestudos.github.io/lojinha-de-achadinhos/">

  <meta name="theme-color" content="#000000">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Container Principal Centralizado */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }

    /* Imagem Principal do App */
    .app-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Áreas Clicáveis em Cima dos Botões da Imagem */
    .btn-hotspot {
      position: absolute;
      left: 23%;
      width: 54%;
      height: 6.8%;
      border-radius: 14px;
      z-index: 10;
      cursor: pointer;
      text-decoration: none;
    }

    /* Posição dos Botões na Arte */
    .btn-shopee {
      top: 45.2%;
    }

    .btn-mercadolivre {
      top: 56.8%;
    }

    .btn-whatsapp {
      top: 68.4%;
    }

    /* Feedback visual de toque no celular */
    .btn-hotspot:active {
      background-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Nova Imagem do App -->
    <img src="1000278928.jpg" alt="Lojinha de Achadinhos do Carlos" class="app-image" id="main-img" onerror="carregarImagemBackup()">

    <!-- Links Clicáveis Sobrepostos -->
    <a href="https://collshp.com/chztrlojinha?view=storefront" target="_blank" rel="noopener noreferrer" class="btn-hotspot btn-shopee" title="Shopee"></a>

    <a href="https://mercadolivre.com/sec/1nNnSoA" target="_blank" rel="noopener noreferrer" class="btn-hotspot btn-mercadolivre" title="Mercado Livre"></a>

    <a href="https://chat.whatsapp.com/KyKtk9fRNCM9AAGgERy6Z0" target="_blank" rel="noopener noreferrer" class="btn-hotspot btn-whatsapp" title="WhatsApp"></a>

  </div>

  <script>
    // Sistema para garantir que se o nome no GitHub falhar, ele busca a imagem enviada
    function carregarImagemBackup() {
      const img = document.getElementById('main-img');
      if (!img.dataset.tentou) {
        img.dataset.tentou = "true";
        img.src = "banner.jpg";
      }
    }
  </script>

</body>
</html>
