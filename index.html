<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🛒 Lojinha de Achadinhos do Carlos</title>
  
  <link rel="manifest" href="https://carlosestudos.github.io/lojinha-de-achadinhos/manifest.json">

  <meta property="og:type" content="website">
  <meta property="og:title" content="🛒 Lojinha de Achadinhos do Carlos">
  <meta property="og:description" content="As melhores ofertas com ótimo custo-benefício!">
  <meta property="og:image" content="https://carlosestudos.github.io/lojinha-de-achadinhos/1000278928.jpg">
  <meta property="og:url" content="https://carlosestudos.github.io/lojinha-de-achadinhos/">

  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Container Principal */
    .app-wrapper {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000000;
    }

    /* Imagem de Fundo Completa */
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Container dos Botões Interativos */
    .buttons-overlay {
      width: 100%;
      padding: 0 16px;
      margin-top: -20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      padding-bottom: 25px;
    }

    .btn {
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease, filter 0.15s ease;
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
      filter: brightness(1.15);
    }

    .btn-shopee {
      background: linear-gradient(135deg, #FF5722 0%, #EE4D2D 100%);
      color: #ffffff;
    }

    .btn-mercadolivre {
      background: linear-gradient(135deg, #FFF159 0%, #FFE600 100%);
      color: #2D3277;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #ffffff;
    }

    .footer-text {
      font-size: 0.75rem;
      color: #888888;
      text-align: center;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <img src="1000278928.jpg" alt="Lojinha de Achadinhos do Carlos" class="banner-img">

    <div class="buttons-overlay">
      
      <a href="https://collshp.com/chztrlojinha?view=storefront" target="_blank" rel="noopener noreferrer" class="btn btn-shopee">
        🛒 Ver Ofertas na Shopee
      </a>

      <a href="https://mercadolivre.com/sec/1nNnSoA" target="_blank" rel="noopener noreferrer" class="btn btn-mercadolivre">
        🤝 Ver Ofertas no Mercado Livre
      </a>

      <a href="https://chat.whatsapp.com/KyKtk9fRNCM9AAGgERy6Z0" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
        💬 Entrar no Grupo VIP do WhatsApp
      </a>

    </div>

    <p class="footer-text">Carlos Achadinhos © Todos os direitos reservados.</p>

  </div>

</body>
</html>
