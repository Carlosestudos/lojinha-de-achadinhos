<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Carlos Achadinhos</title>
  
  <!-- Arquivo de Manifesto para o Aplicativo (PWA) -->
  <link rel="manifest" href="https://carlosestudos.github.io/lojinha-de-achadinhos/manifest.json">

  <!-- Meta Tags para Prévia no WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="🛍️ Carlos Achadinhos">
  <meta property="og:description" content="As melhores promoções da Shopee e Mercado Livre em um só lugar! Entre e confira.">
  <meta property="og:image" content="https://carlosestudos.github.io/lojinha-de-achadinhos/logo.jpg">
  <meta property="og:image:secure_url" content="https://carlosestudos.github.io/lojinha-de-achadinhos/logo.jpg">
  <meta property="og:image:type" content="image/jpg">
  <meta property="og:image:width" content="300">
  <meta property="og:image:height" content="300">
  <meta property="og:url" content="https://carlosestudos.github.io/lojinha-de-achadinhos/">

  <!-- Configurações para Aplicativo no Celular -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carlos Achadinhos">
  <meta name="theme-color" content="#000000">

  <!-- Ícones do App -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://carlosestudos.github.io/lojinha-de-achadinhos/logo.jpg">
  <link rel="icon" type="image/jpeg" sizes="192x192" href="https://carlosestudos.github.io/lojinha-de-achadinhos/logo.jpg">
  <link rel="shortcut icon" href="https://carlosestudos.github.io/lojinha-de-achadinhos/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .app-viewport {
      position: relative;
      width: 100vw;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .banner-wrapper {
      position: relative;
      width: 100%;
      height: auto;
      overflow: hidden;
      background-color: #000000;
    }

    .banner-wrapper video, .banner-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .overlay-actions {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .btn-whatsapp-overlay {
      position: absolute;
      top: 4%;
      right: 4%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: clamp(0.65rem, 2vw, 0.95rem);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.5);
      z-index: 10;
    }

    .btn-whatsapp-overlay svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .hotspot-shopee {
      position: absolute;
      top: 47%;
      left: 32%;
      width: 17%;
      height: 9%;
      border-radius: 20px;
      cursor: pointer;
      z-index: 5;
    }

    .hotspot-ml {
      position: absolute;
      top: 47%;
      left: 50.5%;
      width: 17%;
      height: 9%;
      border-radius: 20px;
      cursor: pointer;
      z-index: 5;
    }

    .hotspot-shopee:active, .hotspot-ml:active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .footer-note {
      color: #718096;
      font-size: 0.75rem;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <div class="banner-wrapper">
      <video autoplay loop muted playsinline>
        <source src="fundo-lojinha.mp4" type="video/mp4">
        Seu navegador não suporta vídeos.
      </video>

      <div class="overlay-actions">
        <a href="https://chat.whatsapp.com/KyKtk9fRNCM9AAGgERy6Z0" target="_blank" rel="noopener noreferrer" class="btn-whatsapp-overlay">
          <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.842-1.001z"/></svg>
          Chama no WhatsApp
        </a>

        <a href="https://collshp.com/chztrlojinha?view=storefront" target="_blank" rel="noopener noreferrer" class="hotspot-shopee" title="Shopee"></a>
        <a href="https://mercadolivre.com/sec/1nNnSoA" target="_blank" rel="noopener noreferrer" class="hotspot-ml" title="Mercado Livre"></a>
      </div>
    </div>

    <p class="footer-note">Carlos Achadinhos © Todos os direitos reservados.</p>

  </div>

</body>
</html>
