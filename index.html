<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lojinha de Achadinhos | As melhores ofertas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background-color: #000000;
    }

    /* Vídeo preenche 100% da tela no PC e Mobile */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Garante tela cheia sem bordas pretas */
      transform: translate(-50%, -50%);
      z-index: 1;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Camada dos botões ajustada */
    .buttons-layer {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 520px;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 2;
    }

    /* Áreas de clique transparentes alinhadas */
    .btn-click {
      flex: 1;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 25px;
      transition: all 0.2s ease-in-out;
      background: rgba(255, 255, 255, 0.01);
      border: 2px solid transparent;
    }

    .btn-click:hover, .btn-click:active {
      transform: scale(1.03);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    /* Adaptação específica para Celular (Telas em Pé / Portátil) */
    @media (max-width: 768px) {
      .bg-video {
        object-fit: cover;
      }
      
      .buttons-layer {
        top: 46%;
        width: 90%;
        gap: 10px;
      }

      .btn-click {
        height: 45px;
      }
    }
  </style>
</head>
<body>

  <!-- Vídeo em Tela Cheia -->
  <video autoplay loop muted playsinline class="bg-video">
    <source src="fundo-lojinha.mp4" type="video/mp4">
    Seu navegador não suporta vídeos em HTML5.
  </video>

  <!-- Botões transparentes sobrepostos -->
  <div class="buttons-layer">
    <a href="https://collshp.com/chztrlojinha?view=storefront" target="_blank" rel="noopener noreferrer" class="btn-click" title="Ir para Shopee"></a>
    <a href="https://mercadolivre.com/sec/1nNnSoA" target="_blank" rel="noopener noreferrer" class="btn-click" title="Ir para Mercado Livre"></a>
  </div>

</body>
</html>
