<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lojinha de Achadinhos do Carlos</title>

    <meta name="description"
          content="As melhores ofertas com ótimo custo-benefício!">

    <meta property="og:type" content="website">
    <meta property="og:title"
          content="Lojinha de Achadinhos do Carlos">

    <meta property="og:description"
          content="As melhores ofertas com ótimo custo-benefício!">

    <meta property="og:image"
          content="https://carlosestudos.github.io/lojinha-de-achadinhos/1000278928.jpg">

    <meta property="og:url"
          content="https://carlosestudos.github.io/lojinha-de-achadinhos/">

    <meta name="theme-color" content="#000000">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        /*
        =====================================================
        ÁREA PRINCIPAL DA ARTE
        =====================================================
        */

        .arte {
            position: relative;

            width: 100%;
            max-width: 864px;

            line-height: 0;
        }

        /*
        A imagem NÃO deve ser cortada,
        escurecida ou distorcida.
        */

        .arte img {
            display: block;

            width: 100%;
            height: auto;

            filter: none;
            opacity: 1;
        }

        /*
        =====================================================
        ÁREAS CLICÁVEIS TRANSPARENTES
        =====================================================

        Os links ficam por cima dos botões desenhados
        na própria imagem.

        Eles são transparentes, portanto o usuário
        continua vendo exatamente a arte original.
        */

        .botao-link {
            position: absolute;

            display: block;

            z-index: 10;

            background: transparent;

            border: none;

            text-decoration: none;

            cursor: pointer;

            /*
            Evita qualquer efeito visual sobre a arte.
            */
            outline: none;
        }

        /*
        =====================================================
        SHOPEE
        =====================================================
        */

        .shopee {
            left: 24.0%;
            top: 45.3%;

            width: 61.0%;
            height: 10.5%;
        }

        /*
        =====================================================
        MERCADO LIVRE
        =====================================================
        */

        .mercadolivre {
            left: 24.5%;
            top: 56.7%;

            width: 61.0%;
            height: 11.0%;
        }

        /*
        =====================================================
        WHATSAPP
        =====================================================
        */

        .whatsapp {
            left: 26.0%;
            top: 68.5%;

            width: 60.0%;
            height: 11.0%;
        }

        /*
        =====================================================
        ACESSIBILIDADE
        =====================================================
        */

        .botao-link:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

    </style>

</head>

<body>

    <main class="arte">

        <!-- ARTE ORIGINAL -->
        <img
            src="1000278928.jpg"
            alt="Lojinha de Achadinhos do Carlos"
        >

        <!-- =================================================
             ÁREA CLICÁVEL DA SHOPEE
             ================================================= -->

        <a
            class="botao-link shopee"
            href="https://s.shopee.com.br/AUimiY02NH"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir ofertas da Shopee">
        </a>


        <!-- =================================================
             ÁREA CLICÁVEL DO MERCADO LIVRE
             ================================================= -->

        <a
            class="botao-link mercadolivre"
            href="https://biolivre.com.br/achadoscarlos"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir ofertas do Mercado Livre">
        </a>


        <!-- =================================================
             ÁREA CLICÁVEL DO WHATSAPP
             ================================================= -->

        <a
            class="botao-link whatsapp"
            href="https://chat.whatsapp.com/KyKtk9fRNCM9AAGgERy6Z0"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Entrar no grupo VIP do WhatsApp">
        </a>

    </main>

</body>

</html>
