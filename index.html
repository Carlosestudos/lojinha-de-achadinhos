<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lojinha de Achadinhos | As melhores ofertas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background-color: #000000;
    }

    /* Container principal para alinhar perfeitamente vídeo e botões */
    .viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Regulação do Vídeo para PC e Celular */
    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      object-fit: cover;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    /* Regulação da camada de botões */
    .buttons-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 500px;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 2;
    }

    /* Botões transparentes com regulagem de área de clique */
    .btn-click {
      flex: 1;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 30px;
      transition: all 0.2s ease-in-out;
      background: rgba(255, 255, 255, 0.01);
      border: 2px solid transparent;
    }

    .btn-click:hover, .btn-click:active {
      transform: scale(1.03);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    /* Ajuste fino específico para Celular (Mobile) */
    @media (max-width: 768px) {
      .bg-video {
        object-fit: contain; /* Mantém a proporção exata da arte no celular */
        width: 100%;
        height: 100%;
      }

      .buttons-layer {
        top: 48%; /* Alinha com a posição exata dos botões da arte no celular */
        width: 88%;
        gap: 12px;
      }

      .btn-click {
        height: 44px;
      }
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <video autoplay loop muted playsinline class="bg-video">
      <source src="fundo-lojinha.mp4" type="video/mp4">
      Seu navegador não suporta vídeos em HTML5.
    </video>

    <div class="buttons-layer">
      <a href="https://collshp.com/chztrlojinha?view=storefront" target="_blank" rel="noopener noreferrer" class="btn-click" title="Ir para Shopee"></a>
      <a href="https://mercadolivre.com/sec/1nNnSoA" target="_blank" rel="noopener noreferrer" class="btn-click" title="Ir para Mercado Livre"></a>
    </div>
  </div>

</body>
</html>
